# GoReleaser configuration (v2). Unverified: it has not been run during development.
version: 2
project_name: teardown

builds:
  - id: teardown
    main: ./cmd/teardown
    binary: teardown
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/q6r/teardown/internal/version.version={{ .Version }}
      - -X github.com/q6r/teardown/internal/version.commit={{ .ShortCommit }}
      - -X github.com/q6r/teardown/internal/version.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - docs/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: q6r
    name: teardown
  draft: false
  prerelease: auto
